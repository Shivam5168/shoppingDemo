name: Deploy to Azure VM

on:
  push:


jobs:
  build:
    name: Build the application
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Build the application
    - name: Build the application
      run: npm run build

    # Archive build artifacts
    - name: Archive build artifacts
      run: tar -czf build.tar.gz build

    # Upload build artifacts for use in the deploy step
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: build.tar.gz

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build

    steps:
    # Download build artifacts from the build job
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts

    # Deploy to Azure VM via SSH using username and password
    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.AZURE_VM_IP }}
        username: ${{ secrets.AZURE_VM_USER }}
        password: ${{ secrets.AZURE_VM_PASSWORD }}
        port: 22 # Default SSH port
        script: |
          # Transfer build artifacts
          scp build.tar.gz ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }}:/home/${{ secrets.AZURE_VM_USER }}

          # SSH into the VM and deploy
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            cd /home/${{ secrets.AZURE_VM_USER }}
            tar -xzf build.tar.gz
            npm install --production
            pm2 stop all || true
            pm2 start build/app.js --name "my-node-app"
          EOF
