name: Deploy to Azure VM

on:
  push:


jobs:
  deploy:
    name: Deploy Application to Azure VM
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Deploy to Azure VM using SSH
    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.AZURE_VM_IP }}
        username: ${{ secrets.AZURE_VM_USER }}
        password: ${{ secrets.AZURE_VM_PASSWORD }}
        port: 22 
        script: |
          # Remove existing application folder (optional)
          rm -rf /home/${{ secrets.AZURE_VM_USER }}/ShoppingDemo

          # Create the directory for the application
          mkdir -p /home/${{ secrets.AZURE_VM_USER }}/ShoppingDemo

          # Transfer the entire codebase to the VM
          scp -r ./* ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }}:/home/${{ secrets.AZURE_VM_USER }}/ShoppingDemo

          # SSH into the VM and start the application
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            cd /home/${{ secrets.AZURE_VM_USER }}/ShoppingDemo
            
            # Install dependencies (if required)
            npm install

            # Stop the existing app (optional)
            pm2 stop all || true

            # Start the application using PM2
            pm2 start app.js --name "ShoppingDemo"

            # Save the PM2 process list
            pm2 save
          EOF
