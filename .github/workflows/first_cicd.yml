name: My First Node.js Code CI/CD

on: push

jobs:
  build:
    name: Build the application
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x ] # Specify Node.js version for the build
    steps:
    # Checkout the code
    - uses: actions/checkout@v4

    # Set up Node.js environment
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Build the application
    - name: Build the application
      run: npm run build

    # Upload the build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: build # Path to the directory containing the build output

  deploy:
    name: Deploy the application
    runs-on: ubuntu-latest
    needs: build # Ensure this job waits for the 'build' job to complete successfully
    steps:
    # Download the build artifacts
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts

    # Deploy to Azure Static Web App
    - name: Deploy to Azure Static Web App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        app_location: "/" # Location of your app's source code
        output_location: "build" # Location of the downloaded build artifacts
